aid: relace
name: Relace
description: >-
  Relace builds purpose-built AI models and infrastructure for coding agents.
  Its hosted API exposes fast, specialized models — Instant Apply (relace-apply-3)
  for merging LLM code edits at over 10k tok/s, a Code Reranker (relace-rank) and
  code embeddings for semantic codebase retrieval, and Compact for compressing
  agent traces — alongside Relace Repos, a "GitHub for AI agents" source-control
  layer with built-in two-stage retrieval and Fast Agentic Search. Authentication
  is a Bearer API key (rlc- prefix); official Python and TypeScript SDKs and an
  MCP server are published, and enterprise SOC 2, on-premise, and VPC-isolated
  deployments are offered. Backed by Matrix Partners and Y Combinator.
